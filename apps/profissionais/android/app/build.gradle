apply plugin: 'com.android.application'

android {
    namespace = "br.com.procuroapp.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "br.com.procuroapp.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        /* O número da versão vem do workflow, não daqui.

           A Play Store recusa um envio cujo versionCode já foi usado, e
           esse é o erro mais bobo de se cometer: monta-se o arquivo,
           espera-se, e a loja devolve "versão 1 já existe". Fixo no
           arquivo, ele obriga alguém a lembrar de somar 1 toda vez — e a
           pessoa que publica trabalha do celular.

           O workflow passa `-PversionCode=<número do envio>` e o
           `versionName` legível junto. Sem eles (compilação local, para
           testar), continua valendo 1 / "1.0". */
        versionCode project.hasProperty('versionCode') ? project.versionCode.toInteger() : 1
        versionName project.hasProperty('versionName') ? project.versionName : "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    /* A chave que assina o app.

       Ela NÃO mora no repositório — mora nos segredos do GitHub, e o
       workflow a escreve em disco só durante a montagem. Uma chave de
       assinatura versionada é a chave da identidade do app disponível a
       quem clonar o projeto.

       Sem os segredos (compilação local, para testar), este bloco fica
       nulo e o Gradle assina com a chave de depuração — que serve para
       instalar no próprio celular e NÃO serve para a loja. É de propósito
       que ele não quebre: quem só quer ver o app rodando não precisa da
       chave de verdade.

       Guarde a chave em dois lugares. Perdê-la significa não conseguir
       mais atualizar o app publicado — não existe recuperação, e a saída
       é publicar outro app, do zero, sem os usuários do primeiro. */
    signingConfigs {
        release {
            def arquivo = System.getenv("ANDROID_KEYSTORE_FILE")
            if (arquivo && file(arquivo).exists()) {
                storeFile file(arquivo)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig System.getenv("ANDROID_KEYSTORE_FILE") ? signingConfigs.release : null
            /* Ligada: o Gradle encolhe e ofusca o código Java do embrulho.
               Estava desligada, o que só engorda o arquivo à toa — o app em
               si é HTML e não é afetado. As regras do Capacitor já vêm no
               proguard-rules.pro do próprio projeto. */
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
