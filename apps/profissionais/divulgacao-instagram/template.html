<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; padding: 0;
    width: 1080px; height: 1350px;
    background: linear-gradient(160deg, #12305e, #0a1a2f);
    overflow: hidden;
    font-family: -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
    color: #fff;
    display: flex;
    flex-direction: column;
  }
  .topo {
    padding: 90px 90px 0;
    display: flex;
    align-items: center;
  }
  .wordmark {
    font-size: 56px;
    font-weight: 500;
    letter-spacing: 0.01em;
    text-transform: lowercase;
  }
  .o-final { position: relative; }
  .acento {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: 0.74em; width: 0.62em; color: #f0cd88;
  }
  .meio {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 90px;
  }
  .titulo {
    font-size: 84px;
    font-weight: 800;
    line-height: 1.14;
    letter-spacing: -0.01em;
    max-width: 820px;
  }
  .sub {
    margin-top: 36px;
    font-size: 34px;
    font-weight: 500;
    color: rgba(255,255,255,0.82);
    line-height: 1.4;
    max-width: 780px;
  }
  .rodape {
    padding: 0 90px 90px;
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .cta {
    background: #fff;
    color: #0a1a2f;
    border-radius: 999px;
    padding: 26px 44px;
    font-size: 34px;
    font-weight: 700;
  }
  .site {
    font-size: 30px;
    font-weight: 600;
    color: #f0cd88;
  }
</style>
</head>
<body>
  <div class="topo">
    <span class="wordmark">procur<span class="o-final">o<svg class="acento" viewBox="0 0 28 12" fill="none"><path d="M2.5 9.5 14 2.5 25.5 9.5" stroke="currentColor" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span>
  </div>
  <div class="meio">
    <div class="titulo" id="titulo">TITULO</div>
    <div class="sub" id="sub">SUBTITULO</div>
  </div>
  <div class="rodape">
    <div class="cta">Cadastro grátis</div>
    <div class="site">procuroapp.com.br</div>
  </div>
</body>
</html>
