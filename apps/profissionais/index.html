    <meta name="description" content="procurô: marketplace de busca de profissionais por cidade, com avaliações, selo de verificação e anúncios em destaque." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="procurô" />

    <!-- Como o link aparece quando alguém manda o app no WhatsApp.
         Sem isto, o compartilhamento vira uma linha de endereço crua, e o
         boca a boca é justamente como este app vai crescer numa cidade.

         Estes três acompanham o LIGAR_DOMINIO_NOVO de
         src/lib/enderecoCanonico.ts: se um dia a chave voltar para `false`,
         eles voltam junto. Um canonical apontando para domínio que não
         responde manda o Google desindexar o app. -->
    <link rel="canonical" href="https://www.procuroapp.com.br/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="procurô" />
    <meta property="og:url" content="https://www.procuroapp.com.br/" />
    <meta property="og:title" content="procurô — quem faz, aqui perto" />
    <meta property="og:description" content="Encontre profissionais de Itabirito e região, com a opinião de quem já contratou. Anunciar é grátis." />
    <meta property="og:image" content="https://www.procuroapp.com.br/icon-512.png" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary" />
  </head>
