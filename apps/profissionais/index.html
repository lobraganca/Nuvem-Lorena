<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ei Emprego — vagas e profissionais em Itabirito</title>
    <meta name="description" content="Ei Emprego: empresas encontram quem faz o serviço, e quem procura trabalho recebe as vagas da cidade." />
    <!-- O ícone da aba e da tela do celular.
         Ele era um SVG escrito aqui dentro, com o azul-marinho e o laranja
         da marca ANTIGA. Sobreviveu à troca da logo porque a troca mexeu
         nos arquivos de `public/` e ninguém olhou o `index.html`: os
         ícones do app já eram os novos, e só a abinha do navegador
         continuava mostrando a marca velha — que foi como a dona viu
         ("o ícone do site está com a logo antiga").

         Agora aponta para os MESMOS arquivos que o manifesto usa, então
         trocar a logo de novo é trocar as imagens, e nada mais. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <!-- A fonte da Google.
         Roboto já é a fonte do sistema em Android, então na maioria dos
         celulares de Itabirito ela nem chega a ser baixada — o navegador
         usa a que já está lá. O `preconnect` existe para os outros casos:
         sem ele, a busca do servidor da fonte só começa depois de o CSS
         ser lido, e o texto pisca trocando de fonte no meio da leitura.

         `display=swap` para o texto aparecer na fonte de reserva enquanto
         a Roboto não chega. Sem isso a tela fica com a área de texto em
         branco — e num 4G fraco isso são segundos olhando o nada. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <!-- Igual ao azul da barra de topo do app (--ei-acento). Se os dois
         discordarem, o celular pinta uma faixa de um tom e o app de outro,
         e a emenda aparece bem em cima do relogio. -->
    <meta name="theme-color" content="#0A72C4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ei Emprego" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Como o link aparece quando alguém manda o app no WhatsApp.
         Sem isto, o compartilhamento vira uma linha de endereço crua, e o
         boca a boca é justamente como este app vai crescer numa cidade.

         Estes três acompanham o LIGAR_DOMINIO_NOVO de
         src/lib/enderecoCanonico.ts: se um dia a chave voltar para `false`,
         eles voltam junto. Um canonical apontando para domínio que não
         responde manda o Google desindexar o app. -->
    <link rel="canonical" href="https://www.empregoitabirito.com.br/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ei Emprego" />
    <meta property="og:url" content="https://www.empregoitabirito.com.br/" />
    <meta property="og:title" content="Ei Emprego — trabalho aqui perto" />
    <meta property="og:description" content="Empresas de Itabirito encontram quem faz o serviço. Quem procura trabalho recebe as vagas no celular. Cadastrar é grátis." />
    <meta property="og:image" content="https://www.empregoitabirito.com.br/icon-512.png" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>

    <!-- ══ SE A FOLHA DE ESTILO NÃO CHEGOU, RECARREGA UMA VEZ — 05/09 ══
         A dona mandou o print da tela de entrar CRUA: fonte de jornal,
         link azul sublinhado, campos quadrados. O app inteiro tinha
         carregado — o React desenhou a tela toda —, só o arquivo de
         estilo não veio.

         Como isso acontece: o `index.html` nunca fica guardado (de
         propósito, ver o vite.config.ts), então ele vem sempre novo. Os
         arquivos de estilo têm o endereço com um código no nome, e quando
         a publicação troca no meio do caminho o endereço que o HTML velho
         pede deixa de existir. Um pedido falha, e a página fica assim até
         alguém recarregar. Ninguém sabe que é só recarregar — o que chega
         aqui é "a tela está quebrada".

         A pergunta é uma variável que só existe dentro do theme.css. Se
         ela não estiver lá, o estilo não chegou.

         Recarrega UMA vez, e nunca mais nesta aba (`sessionStorage`).
         Sem essa trava, um site que subisse sem estilo por qualquer outro
         motivo entraria em laço de recarregar para sempre, que é bem pior
         que uma tela feia. -->
    <script>
      window.addEventListener("load", function () {
        try {
          var chegou = getComputedStyle(document.documentElement)
            .getPropertyValue("--ei-folha-de-estilo")
            .trim();
          if (chegou) return;
          if (sessionStorage.getItem("ei-recarreguei-sem-estilo")) return;
          sessionStorage.setItem("ei-recarreguei-sem-estilo", "1");
          location.reload();
        } catch (e) {
          /* Aba anônima com armazenamento bloqueado: sem a trava, não
             recarrega. Tela feia é melhor que laço infinito. */
        }
      });
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
