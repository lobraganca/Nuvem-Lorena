name: Publicar site de teste

# Publica o Avena no GitHub Pages a cada envio, para existir um endereço na
# internet que dá para abrir no celular sem baixar arquivo nenhum.
on:
  push:
    branches:
      - main
      - claude/avena-travel-memories-app-koj0zy
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; se chegar outra no meio, a mais nova espera a atual
# terminar em vez de cancelá-la pela metade.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Conferir tipos e estilo
        run: |
          npm run typecheck
          npm run lint

      - name: Montar o site
        # O painel administrativo fica de fora: VITE_ADMIN_ENABLED não é
        # definido aqui, então o código dele nem entra no pacote publicado.
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # As duas do Supabase que podem ir para o site. A chave publicável é
          # pública por definição — ela fica dentro do JavaScript que qualquer
          # visitante baixa, e isso não é falha: tudo o que ela faz passa pelas
          # políticas em supabase/migrations/0002_seguranca.sql.
          #
          # Vêm de variáveis do repositório para que trocar de projeto no
          # Supabase não exija mexer neste arquivo. Se estiverem vazias, o site
          # publica sem banco e volta a guardar tudo no navegador — que é o
          # comportamento certo para um site sem servidor, e não um erro.
          #
          # A chave service_role NUNCA entra aqui. Ela ignora todas as regras
          # do banco, e qualquer coisa neste arquivo vai parar no site.
          # O valor à direita do || é o projeto atual, para o site de teste
          # funcionar sem depender de ninguém lembrar de cadastrar variável.
          # Cadastrando as duas em Settings > Secrets and variables > Actions >
          # Variables, elas passam à frente destas e este arquivo não muda.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://wkuwwzcucsxonhsblkmc.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_WHR3zOoMSxWVSVosA4xmkQ_edIju99P' }}
        run: npm run build

      - name: Conferir se o banco entrou no pacote
        # Sem isto, um erro de digitação no nome da variável publica um site
        # que parece funcionar e guarda tudo só no navegador — a falha some, e
        # só aparece quando uma agência reclama que a reserva não chegou.
        run: |
          grep -rq "supabase.co" dist/assets/*.js \
            && echo "Banco ligado no site publicado." \
            || { echo "ERRO: o endereço do banco não entrou no pacote."; exit 1; }

      - name: Responder as rotas internas
        # O GitHub Pages não conhece /destination nem /desejos. Servindo a
        # mesma página no 404, quem abre um link direto cai no app, que então
        # mostra a tela certa.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
