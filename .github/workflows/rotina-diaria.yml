# Chama a rotina diária do procurô (renew-annual-plans).
#
# A rotina avisa por e-mail quem paga por Pix antes do plano vencer, e
# encerra os patrocínios de categoria já vencidos. Sem ela, quem pagou por
# Pix perde o benefício em silêncio.
#
# Por que aqui e não no banco: o agendamento por pg_cron + pg_net funciona
# no papel, mas os pedidos ficaram presos na fila do pg_net sem nunca chegar
# à function — e diagnosticar isso exige acesso a partes do banco que o
# painel não expõe. Aqui o disparo é observável: cada execução aparece na
# aba Actions com o código de resposta, e quem for investigar um dia lê o
# log em vez de adivinhar.
#
# O expurgo diário (dados antigos + cobranças abandonadas) continua no
# pg_cron, e aquele funciona: é SQL puro, não faz chamada HTTP nenhuma.
#
# Segredo exigido:
#   CRON_SECRET — a mesma senha guardada em Edge Functions > Secrets no
#                 Supabase. É só desta rotina: quem a tiver consegue, no
#                 máximo, disparar os avisos antes da hora.

name: Rotina diária

on:
  schedule:
    # 12:00 UTC = 09:00 em Brasília. De manhã de propósito: se o e-mail de
    # renovação chega às 3 da madrugada, ele é lido junto com o spam.
    - cron: "0 12 * * *"
  # Permite disparar à mão pela aba Actions, para testar sem esperar o dia.
  workflow_dispatch:

jobs:
  chamar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar a rotina
        env:
          SENHA: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SENHA" ]; then
            echo "O segredo CRON_SECRET não está configurado."
            echo "Crie em: Settings > Secrets and variables > Actions."
            exit 1
          fi

          # -w guarda o código de status para conferir depois; sem isso o
          # passo passaria mesmo com 401, e a rotina ficaria anos sem rodar
          # sem ninguém perceber.
          codigo=$(curl -sS -o /tmp/resposta.txt -w "%{http_code}" \
            -X POST "https://dfdinrimxqoqjedemjbw.functions.supabase.co/renew-annual-plans" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $SENHA" \
            -d '{}')

          echo "Código: $codigo"
          echo "Resposta: $(cat /tmp/resposta.txt)"

          if [ "$codigo" != "200" ]; then
            echo "A rotina não respondeu 200 — veja a mensagem acima."
            exit 1
          fi
