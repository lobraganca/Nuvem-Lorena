# Publica o Busca Itabirito chamando o Deploy Hook da Vercel.
#
# A integração automática entre GitHub e Vercel parou de entregar eventos
# neste repositório: nem os envios do agente nem os commits feitos pela dona
# do repositório geram deploy, embora a Vercel construa perfeitamente quando
# o gatilho é chamado à mão. Depender de alguém abrir um link a cada
# publicação é frágil — esquece-se, e o site fica velho sem ninguém notar.
#
# Aqui o próprio GitHub chama o gatilho. É o mesmo endereço que funciona no
# navegador, agora disparado por quem já está presente no momento do envio.
#
# O endereço fica em `secrets.VERCEL_DEPLOY_HOOK`, não no arquivo: quem tem
# esse link pode disparar publicações do projeto à vontade, e um repositório
# público exporia isso a qualquer um.

name: Publicar Busca Itabirito

on:
  push:
    branches:
      # O Ei publica da sua propria branch. A duqnk8 passou a receber o
      # procuro por engano, e o endereco do Ei chegou a mostrar o app errado:
      # separar as branches e o que impede os dois apps de se atropelarem.
      - ei-itabirito
    # Só o app dos profissionais. Mudanças na pasta do Avena não têm por que
    # republicar este site.
    paths:
      - "apps/profissionais/**"
      - ".github/workflows/publicar-busca-itabirito.yml"
  # Permite disparar à mão pela aba Actions, sem precisar de commit.
  workflow_dispatch:

jobs:
  disparar:
    runs-on: ubuntu-latest
    steps:
      # ── O GATILHO SAIU DE CENA — 01/09 ────────────────────────────────
      # Aqui havia uma chamada ao Deploy Hook da Vercel. Ela parou de
      # funcionar no meio da tarde, e do jeito mais traiçoeiro possível:
      # em vez de construir a ponta da branch, a Vercel passou a REFAZER a
      # última build que ela conhecia. A tela de Deployments mostrava
      # linha nova a cada disparo, verde, com o rótulo "Redeploy of…" — e
      # sempre o mesmo commit velho, `ac2dd16`. Quatro correções ficaram
      # de fora do ar sem nada apontar a diferença.
      #
      # O projeto está ligado ao GitHub direto (Settings > Git), e essa
      # ligação já publica sozinha a cada push na branch de produção. Duas
      # portas para a mesma coisa é uma a mais: fica a do GitHub, que é a
      # que sabe qual é o commit.
      #
      # O passo de conferência abaixo continua, e é ele que importa: sem
      # ele, "verde" volta a querer dizer "pedi", e não "está no ar".

      # Chamar o gatilho não é publicar. A Vercel responde "recebi" na hora e
      # constrói depois; se a build falhar, este workflow ficava verde e o
      # site continuava velho — sem nada, em lugar nenhum, apontando a
      # diferença. Foi assim que três correções seguidas pareceram publicadas
      # sem estarem, e a única pessoa que percebeu foi quem usa o app.
      #
      # Aqui o workflow pergunta ao site qual commit ele está servindo, e só
      # fica verde quando a resposta for este commit.
      - name: Conferir se o site já está servindo este commit
        env:
          SITE: https://www.empregoitabirito.com.br
        run: |
          esperado="${{ github.sha }}"
          echo "Esperando o site servir o commit $esperado"
          for tentativa in $(seq 1 40); do
            resposta=$(curl -sS --max-time 10 "$SITE/versao.json?t=$(date +%s)" || echo "")
            servido=$(echo "$resposta" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('commit',''))" 2>/dev/null || echo "")
            if [ "$servido" = "$esperado" ]; then
              echo "O site está servindo $servido"

              # ── A SEGUNDA PERGUNTA ────────────────────────────────────
              # Servir o commit certo não basta. Em 31/08 o site serviu o
              # commit certo o dia inteiro e NINGUÉM conseguia entrar: os
              # dois projetos da Vercel tinham acabado de ser separados, o
              # projeto novo nasceu sem VITE_SUPABASE_URL e VITE_SUPABASE_
              # ANON_KEY, e o app subiu sem saber com qual banco falar.
              #
              # Este workflow ficou VERDE o tempo todo, porque só
              # perguntava o commit. Agora pergunta também se a build sabia
              # com qual banco falar — o `banco` do versao.json, que o
              # vite.config.ts carimba.
              banco=$(echo "$resposta" \
                | python3 -c "import sys,json; print(json.load(sys.stdin).get('banco'))" 2>/dev/null || echo "None")
              if [ "$banco" = "True" ]; then
                echo "Publicado: e a build sabe com qual banco falar."
                exit 0
              fi
              if [ "$banco" = "None" ]; then
                echo "Publicado. (Versão antiga do versao.json, sem o campo 'banco' — nada a conferir.)"
                exit 0
              fi
              echo ""
              echo "O SITE ESTÁ NO AR, MAS SEM BANCO — ninguém consegue entrar."
              echo ""
              echo "O app foi construído sem VITE_SUPABASE_URL e/ou"
              echo "VITE_SUPABASE_ANON_KEY. Sem elas o site abre normalmente, a"
              echo "lista vem vazia e o botão de entrar fica desligado. Foi assim"
              echo "em 31/08, e o defeito só apareceu quando alguém tentou entrar."
              echo ""
              echo "Onde resolver — é na VERCEL, não no Supabase:"
              echo "  vercel.com > projeto ei-itabirito > Settings >"
              echo "  Environment Variables"
              echo ""
              echo "  VITE_SUPABASE_URL       https://dfdinrimxqoqjedemjbw.supabase.co"
              echo "                          (sem /rest/v1 no fim)"
              echo "  VITE_SUPABASE_ANON_KEY  a chave anon public, do Supabase"
              echo ""
              echo "As duas como Config, NÃO como Secret: o prefixo VITE_ já as"
              echo "expõe ao navegador de propósito, e Secret não dá para corrigir"
              echo "depois de salvo."
              echo ""
              echo "Depois de salvar, publique de novo — a Vercel só assa as"
              echo "variáveis numa build nova."
              exit 1
            fi
            echo "  tentativa $tentativa — servindo: ${servido:-<sem resposta>}"
            sleep 15
          done
          echo ""
          echo "O site não passou a servir este commit em 10 minutos."
          echo ""
          echo "A causa mais provável, porque já aconteceu: a build funcionou,"
          echo "mas foi para PREVIEW em vez de PRODUCTION. Preview é um endereço"
          echo "de teste que ninguém acessa; o www.empregoitabirito.com.br continua na"
          echo "versão anterior, e nada nesta tela nem na da Vercel aponta a"
          echo "diferença — as duas mostram sucesso."
          echo ""
          echo "Como conferir e resolver:"
          echo "  1. vercel.com > o projeto > Deployments"
          echo "  2. veja a coluna do ambiente. Se as linhas recentes dizem"
          echo "     'Preview' e a última 'Production' é antiga, é isso."
          echo "  3. abra a linha mais recente e use 'Promote to Production'"
          echo "     para resolver agora."
          echo "  4. para não repetir: Settings > Git > Production Branch,"
          echo "     apontando para o ramo que recebe estes commits."
          echo ""
          echo "Se as builds estiverem em Error, aí sim o problema é na build."
          exit 1
