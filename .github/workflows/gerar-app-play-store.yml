# Monta o arquivo que se envia à Google Play (.aab), na nuvem.
#
# Existe porque quem publica o Ei Itabirito trabalha de celular e tablet. Montar
# um app Android normalmente exige Android Studio num computador; aqui o
# GitHub faz isso e devolve o arquivo pronto para baixar pelo próprio
# celular e subir no Play Console.
#
# NÃO dispara sozinho a cada push, de propósito: montar um app é minutos de
# máquina e cada versão gasta um número de envio que não volta. Roda quando
# alguém pede, na aba Actions.
#
# ANTES DO PRIMEIRO USO, quatro segredos precisam existir em
# Settings > Secrets and variables > Actions:
#
#   ANDROID_KEYSTORE_BASE64   a chave de assinatura, em texto
#   ANDROID_KEYSTORE_PASSWORD a senha da chave
#   ANDROID_KEY_ALIAS         o apelido da chave (procuro)
#   ANDROID_KEY_PASSWORD      a senha do apelido
#
# Sem eles o app é montado assinado com a chave de depuração — instala no
# celular para testar e a loja RECUSA. O workflow avisa qual é o caso em
# vez de deixar descobrir no Play Console.

name: Gerar o app para a Play Store

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Versão que aparece para as pessoas (ex.: 1.0.3)'
        required: true
        default: '1.0.0'
      versionCode:
        description: 'Número do envio. Deixe vazio para usar o número da execução. Preencha com um número MAIOR quando a loja disser que o código já foi usado.'
        required: false
        default: ''

permissions:
  contents: write   # necessário para publicar a release com os arquivos

jobs:
  montar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/profissionais

    steps:
      - uses: actions/checkout@v4

      # 22, e não 20: o Capacitor 8 recusa rodar abaixo disso —
      # "The Capacitor CLI requires NodeJS >=22.0.0". A primeira execução
      # deste workflow morreu exatamente aí, DEPOIS de construir o app com
      # sucesso: o build passa em qualquer versão, e só o passo que copia
      # os arquivos para dentro do projeto Android é que exige a nova.
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A Google exige Android 16 (API 36) para envios a partir de
      # 31/08/2026, e o projeto já está nessa versão. O JDK 21 é o exigido
      # pelas ferramentas do Android nessa faixa.
      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar as dependências
        run: npm ci

      - name: Conferir os tipos
        run: npx tsc --noEmit

      # Constrói o site e copia o resultado para dentro do projeto Android.
      # É este passo que faz o app da loja ser o MESMO Ei Itabirito do site — e
      # é por isso que a pasta de saída não fica versionada: aqui ela é
      # sempre a do commit que está sendo montado.
      # O endereço e a chave do banco entram AQUI, e o passo recusa montar
      # sem eles.
      #
      # Eles moram na Vercel, que publica o site — o GitHub não os conhece.
      # Sem esta parte, a montagem termina com sucesso e entrega um app que
      # abre e diz "sem conexão com o banco": não sabe com qual banco
      # falar. Foi o que aconteceu no envio 3, e é a pior forma de falhar,
      # porque tudo fica verde.
      #
      # A chave `anon` é pública por natureza — ela viaja dentro do app de
      # qualquer jeito, e quem protege os dados é a RLS no servidor. Está
      # como segredo do GitHub por organização, não por sigilo.
      - name: Conferir o endereço e a chave do banco
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          FALTA=""
          [ -z "$VITE_SUPABASE_URL" ] && FALTA="VITE_SUPABASE_URL"
          [ -z "$VITE_SUPABASE_ANON_KEY" ] && FALTA="$FALTA VITE_SUPABASE_ANON_KEY"
          if [ -n "$FALTA" ]; then
            echo "::error::Falta(m) o(s) segredo(s):$FALTA — sem eles o app é montado sem saber com qual banco falar, abre e mostra 'sem conexão com o banco'. Crie em Settings > Secrets and variables > Actions. Os valores estão na Vercel (Settings > Environment Variables) ou no Supabase (Settings > API)."
            exit 1
          fi
          echo "Endereço e chave presentes."

      - name: Montar o app e copiar para o Android
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm run build
          npx cap sync android

      # Confere no arquivo montado que o endereço realmente entrou.
      #
      # O passo acima garante que a variável existe; este garante que ela
      # chegou ao pacote. São coisas diferentes: um erro de nome, um build
      # que ignora a variável, e o app volta a sair mudo — com o workflow
      # verde do mesmo jeito.
      - name: Conferir que o banco entrou no app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          HOST=$(echo "$VITE_SUPABASE_URL" | sed -E 's#https?://([^/]+).*#\1#')
          if ! grep -rqF "$HOST" dist/assets/*.js; then
            echo "::error::O endereço do banco não aparece nos arquivos montados. O app sairia sem conexão."
            exit 1
          fi
          echo "O endereço do banco está dentro do app."


      # A chave volta a ser arquivo só aqui dentro, e some com a máquina no
      # fim do trabalho.
      - name: Preparar a chave de assinatura
        id: chave
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "assinado=nao" >> "$GITHUB_OUTPUT"
            echo "::warning::Sem chave de assinatura configurada. O arquivo vai sair assinado para TESTE e a Play Store vai recusar. Configure os quatro segredos em Settings > Secrets and variables > Actions."
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/procuro.jks"
            echo "assinado=sim" >> "$GITHUB_OUTPUT"
          fi

      # O número do envio é o número da execução do workflow: sobe sozinho,
      # nunca repete, e ninguém precisa lembrar de somar 1. A Play Store
      # recusa um envio cujo número já foi usado.
      #
      # Só que "nunca repete" vale para as execuções DESTE workflow, e não
      # para o que a loja já viu. Um envio feito de outro jeito, um arquivo
      # antigo reenviado, uma execução recontada — qualquer um desses deixa
      # a loja com um número que a contagem daqui não conhece, e aí ela
      # recusa sem que haja o que consertar no código.
      #
      # Por isso o campo existe: quando a loja disser "o código da versão já
      # foi usado", basta montar de novo com um número maior. Vazio, o
      # comportamento é o de sempre.
      # Os DOIS formatos, na mesma montagem.
      #
      # `.aab` é o que a Play Store aceita, e SÓ ela: o arquivo não instala
      # em celular nenhum — tocá-lo no Android não faz nada. `.apk` é o que
      # instala direto no aparelho.
      #
      # Os dois são necessários, e por motivos diferentes. Sem o apk não há
      # como ver o app rodando antes de enviar — e sem ver o app rodando não
      # há como tirar as capturas de tela da loja, que precisam mostrar
      # profissionais de verdade. Descobrir que algo quebrou com 12 pessoas
      # testando é caro; descobrir sozinha, no próprio celular, é de graça.
      #
      # Os dois saem da MESMA montagem e da mesma chave, então o que você
      # instala e testa é exatamente o que a loja recebe. Gerados separados,
      # seriam duas coisas parecidas — e a diferença apareceria só depois.
      - name: Montar o .aab e o .apk
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.chave.outputs.assinado == 'sim' && format('{0}/procuro.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon \
            -PversionCode=${{ inputs.versionCode != '' && inputs.versionCode || github.run_number }} \
            -PversionName=${{ inputs.versionName }}

      # Confere o que saiu antes de entregar. Um .aab existe mesmo quando o
      # conteúdo está errado, e o erro só aparece no Play Console — depois
      # da espera.
      # Confere o que saiu antes de entregar. Os arquivos existem mesmo
      # quando o conteúdo está errado, e o erro só apareceria no Play
      # Console — depois da espera.
      - name: Conferir os arquivos
        run: |
          AAB=$(find android -name "*.aab" | head -1)
          APK=$(find android -name "*-release*.apk" | head -1)
          if [ -z "$AAB" ]; then
            echo "::error::Nenhum .aab foi gerado — sem ele não há o que enviar à loja."
            exit 1
          fi
          if [ -z "$APK" ]; then
            echo "::error::Nenhum .apk foi gerado — sem ele não há como instalar no celular para testar."
            exit 1
          fi
          echo "### App montado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Versão | ${{ inputs.versionName }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Número do envio (versionCode) | ${{ inputs.versionCode != '' && inputs.versionCode || github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Para a loja (.aab) | $(du -h "$AAB" | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "| Para o seu celular (.apk) | $(du -h "$APK" | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.chave.outputs.assinado }}" = "sim" ]; then
            echo "| Assinatura | de verdade — serve para a Play Store |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Assinatura | **DE TESTE — a Play Store vai recusar** |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Baixe os dois em **Artifacts**, no fim desta página." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **ei-itabirito-celular-…** — o .apk. Abra no Android para instalar e testar." >> $GITHUB_STEP_SUMMARY
          echo "- **ei-itabirito-loja-…** — o .aab. Este é o que sobe no Play Console (não instala no celular)." >> $GITHUB_STEP_SUMMARY

      # Dois pacotes separados, com nomes que dizem para que servem.
      #
      # Num pacote só, os dois arquivos viriam juntos num zip e caberia a
      # quem baixa descobrir qual é qual — no celular, olhando extensão. Aí
      # se instala o errado, não acontece nada, e a conclusão é que o app
      # não funciona.
      # Cada arquivo passa a dizer, no próprio nome, qual envio ele é.
      #
      # O Gradle nomeia TODO arquivo como `app-release.aab` — o mesmo nome
      # em toda montagem. Baixados um por vez, eles se acumulam na pasta de
      # downloads com nomes idênticos (ou `app-release(1).aab`, que é pior
      # porque parece uma cópia e não uma versão diferente), e na hora de
      # enviar não há como saber qual é qual.
      #
      # Foi o que aconteceu: a loja recusou dizendo que o arquivo já tinha
      # sido usado, e a causa mais provável não era o número gerado aqui —
      # era um arquivo ANTIGO sendo enviado no lugar do novo. O nome do
      # pacote já trazia o envio; o arquivo lá dentro, não, e é o arquivo
      # que se arrasta para o Play Console.
      - name: Dar nome próprio aos arquivos
        env:
          CODIGO: ${{ inputs.versionCode != '' && inputs.versionCode || github.run_number }}
        run: |
          set -euo pipefail
          BASE="procuro-${{ inputs.versionName }}-envio${CODIGO}"
          mv android/app/build/outputs/bundle/release/*.aab \
             "android/app/build/outputs/bundle/release/${BASE}.aab"
          mv android/app/build/outputs/apk/release/*.apk \
             "android/app/build/outputs/apk/release/${BASE}.apk"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Os arquivos se chamam **${BASE}.aab** e **${BASE}.apk**." >> $GITHUB_STEP_SUMMARY
          echo "Confira o nome antes de enviar: a loja recusa um envio repetido." >> $GITHUB_STEP_SUMMARY

      - name: Guardar o .apk (para instalar e testar)
        uses: actions/upload-artifact@v4
        with:
          name: ei-itabirito-celular-${{ inputs.versionName }}-envio${{ inputs.versionCode != '' && inputs.versionCode || github.run_number }}
          path: apps/profissionais/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Guardar o .aab (para enviar à loja)
        uses: actions/upload-artifact@v4
        with:
          name: ei-itabirito-loja-${{ inputs.versionName }}-envio${{ inputs.versionCode != '' && inputs.versionCode || github.run_number }}
          path: apps/profissionais/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: error

      # E, por fim, os mesmos arquivos como RELEASE — que é o único jeito
      # de baixá-los sem entrar na conta.
      #
      # Artefato de Actions exige login, sempre, mesmo em repositório
      # público. Quem publica este app trabalha do celular e nem sempre
      # está logada no GitHub no aparelho que tem à mão; o resultado é
      # ficar com o arquivo pronto e sem conseguir pegá-lo — já aconteceu
      # mais de uma vez, e trava tudo o que vem depois.
      #
      # A release, num repositório público, é um endereço direto: abre em
      # qualquer navegador, sem conta, e entrega o arquivo em si — não um
      # zip para descompactar, que no celular é outra parede.
      #
      # Nada aqui é sigiloso. O endereço e a chave pública do banco viajam
      # dentro do app de qualquer jeito, e quem protege os dados é a RLS no
      # servidor; a chave de ASSINATURA não vai no arquivo, fica nos
      # segredos. O que se publica é o mesmo app que a loja vai distribuir
      # de graça.
      - name: Publicar os arquivos para download direto
        env:
          GH_TOKEN: ${{ github.token }}
          CODIGO: ${{ inputs.versionCode != '' && inputs.versionCode || github.run_number }}
        run: |
          set -euo pipefail
          BASE="procuro-${{ inputs.versionName }}-envio${CODIGO}"
          TAG="envio${CODIGO}"

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "procurô ${{ inputs.versionName }} — envio ${CODIGO}" \
            --notes "Versão ${{ inputs.versionName }}, envio ${CODIGO}.

          - **${BASE}.aab** — este é o que sobe no Play Console. Não instala no celular.
          - **${BASE}.apk** — este instala no celular, para testar antes.

          Baixe clicando no nome do arquivo, logo abaixo." \
            "android/app/build/outputs/bundle/release/${BASE}.aab" \
            "android/app/build/outputs/apk/release/${BASE}.apk"

          URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          {
            echo ""
            echo "### Baixar sem precisar entrar na conta"
            echo ""
            echo "- [${BASE}.aab](${URL}/${BASE}.aab) — para o Play Console"
            echo "- [${BASE}.apk](${URL}/${BASE}.apk) — para instalar no celular"
          } >> $GITHUB_STEP_SUMMARY
          echo "AAB: ${URL}/${BASE}.aab"
          echo "APK: ${URL}/${BASE}.apk"
