<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- A capa do perfil do WhatsApp Business. 16:9 (a medida mais citada é 1211x681; aqui em
     1920x1080, a mesma proporção, com mais nitidez). O WhatsApp não publica a área segura e
     a foto de perfil pode cobrir a parte de baixo: tudo o que importa fica nos 70% de cima. -->
<meta name="tamanho" content="1920x1080">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0F1115; color: #F3F4F0; font-family: "Plus Jakarta Sans", sans-serif; position: relative; }
.arco { position: absolute; border: 3px solid #262A32; border-radius: 50%; }
.arco.um { width: 1000px; height: 1000px; right: -330px; top: -520px; }
.arco.dois { width: 620px; height: 620px; right: -230px; top: -170px; opacity: .7; }
.conteudo { position: absolute; left: 150px; top: 96px; display: grid; gap: 36px; }
.selo { display: inline-flex; align-items: center; gap: 16px; width: fit-content; font-weight: 700; font-size: 30px; letter-spacing: .16em; text-transform: uppercase; border: 3px solid #262A32; border-radius: 999px; padding: 18px 32px; }
.selo::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: #C8F26B; }
h1 { margin: 0; font-weight: 800; font-size: 122px; line-height: 1.04; letter-spacing: -.035em; max-width: 1300px; position: relative; z-index: 0; }
.destaque { position: relative; z-index: -1; background: #C8F26B; color: #0F1115; border-radius: .16em; padding: 0 .14em .04em; }
.site { font-weight: 700; font-size: 40px; color: #A3A7B1; letter-spacing: -.01em; }
.site b { color: #C8F26B; font-weight: 700; }
</style>
</head>
<body>
  <span class="arco um"></span><span class="arco dois"></span>
  <div class="conteudo">
    <span class="selo">Ferramentas sob medida</span>
    <h1>Eu construo a ferramenta pro seu <span class="destaque">negócio.</span></h1>
    <span class="site">Faça o diagnóstico grátis em <b>lorenabraganca.com.br</b></span>
  </div>
</body>
</html>
